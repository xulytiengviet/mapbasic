<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="description" content="MapBasic WebGIS powered by Long Ngo Basemap PMTiles SDK" />
  <title>MapBasic WebGIS · Long Ngo Basemap</title>
  <style>
    :root{color-scheme:dark;--panel:#08101ee8;--line:#ffffff1f;--muted:#aebbd0;--good:#34d399;--bad:#fb7185}
    *{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#09111f;color:#fff;overflow:hidden}
    #map{position:absolute;inset:0;background:#09111f}
    .panel{position:absolute;z-index:10;left:16px;top:16px;width:min(420px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px #0006;backdrop-filter:blur(14px);overflow:hidden}
    .head{padding:16px 18px 13px;border-bottom:1px solid var(--line)}.title{font-size:20px;font-weight:800;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;line-height:1.45}
    .body{padding:13px 18px 16px;display:grid;gap:11px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;gap:7px;align-items:center;padding:6px 9px;border-radius:999px;background:#ffffff12;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}.ok .dot{background:var(--good)}.bad .dot{background:var(--bad)}
    button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#ffffff10;color:#fff;font-weight:700}button.primary{background:#fff;color:#111827}.info{font-size:12px;line-height:1.55;color:var(--muted)}code{color:#c4b5fd;font-size:11px;word-break:break-all}.error{display:none;padding:9px 10px;border-radius:9px;background:#fb71851a;border:1px solid #fb71854d;color:#fecdd3;font-size:12px}.error.show{display:block}
    .brand{position:absolute;z-index:9;right:10px;bottom:10px;padding:7px 10px;border-radius:9px;background:#08101ecf;border:1px solid var(--line);font-size:11px;color:#d7e1f1}
    @media(max-width:640px){.panel{left:8px;top:8px;width:calc(100vw - 16px)}.brand{display:none}}
  </style>
</head>
<body>
  <div id="map"></div>

  <aside class="panel">
    <div class="head">
      <div class="title">MapBasic WebGIS</div>
      <div class="sub">Long Ngo Basemap · PMTiles v3 · raster PNG · zoom 3–12</div>
    </div>
    <div class="body">
      <div class="row">
        <span id="net" class="pill"><span class="dot"></span><span id="netText">Internet…</span></span>
        <span id="state" class="pill"><span class="dot"></span><span id="stateText">Đang tải basemap…</span></span>
      </div>
      <div class="row">
        <button class="primary" id="homeBtn">Toàn vùng</button>
        <button id="locateBtn">Vị trí của tôi</button>
        <button id="reloadBtn">Tải lại</button>
      </div>
      <div class="info">
        <b>SDK</b><br>
        <code>https://cdn.jsdelivr.net/gh/xulytiengviet/basemap@v1.2.0/sdk/basemap.min.js</code><br><br>
        <b>PMTiles</b><br>
        <code>https://xulytiengviet.github.io/mapbasic/basemap.pmtiles</code>
      </div>
      <div id="error" class="error"></div>
    </div>
  </aside>

  <div class="brand">MapBasic · Long Ngo Basemap SDK</div>

  <script
    src="https://cdn.jsdelivr.net/gh/xulytiengviet/basemap@v1.2.0/sdk/basemap.min.js"
    data-target="map"
    data-archive="https://xulytiengviet.github.io/mapbasic/basemap.pmtiles"
    data-center="108.984375,12.0079884"
    data-zoom="5"
    data-navigation="true"
    data-scale="true"
    data-fit-bounds="true">
  </script>

  <script>
    const BOUNDS = [[91.93359375,-2.02106512],[126.03515625,26.03704189]];
    let map = null;
    const net = document.getElementById('net');
    const netText = document.getElementById('netText');
    const state = document.getElementById('state');
    const stateText = document.getElementById('stateText');
    const errorBox = document.getElementById('error');

    function network(){const ok=navigator.onLine;net.className='pill '+(ok?'ok':'bad');netText.textContent=ok?'Internet: Online':'Internet: Offline'}
    function fail(msg){state.className='pill bad';stateText.textContent='Basemap: Lỗi';errorBox.textContent=msg;errorBox.classList.add('show')}
    function ready(){state.className='pill ok';stateText.textContent='Basemap: Sẵn sàng';errorBox.classList.remove('show')}
    network(); addEventListener('online',network); addEventListener('offline',network);

    addEventListener('longngo-basemap-ready', e => {
      map = e.detail.map;
      map.on('error', ev => {
        const message = ev?.error?.message || 'Không tải được tile PMTiles.';
        console.error('[MapBasic]', ev);
        fail(message);
      });
      map.once('idle', ready);
    });

    setTimeout(()=>{if(!map) fail('SDK chưa tạo được bản đồ. Kiểm tra jsDelivr hoặc PMTiles URL.');},8000);

    document.getElementById('homeBtn').onclick=()=>{if(map) map.fitBounds(BOUNDS,{padding:24,duration:600})};
    document.getElementById('reloadBtn').onclick=()=>location.reload();
    document.getElementById('locateBtn').onclick=()=>{
      if(!navigator.geolocation) return fail('Trình duyệt không hỗ trợ Geolocation.');
      navigator.geolocation.getCurrentPosition(
        p=>map?.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:14}),
        e=>fail('Không lấy được vị trí: '+e.message),
        {enableHighAccuracy:true,timeout:10000,maximumAge:30000}
      );
    };
  </script>
</body>
</html>
